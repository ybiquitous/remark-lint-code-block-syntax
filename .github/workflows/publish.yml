name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    uses: ybiquitous/.github/.github/workflows/nodejs-release-reusable.yml@5e88270a455e5daf2387974dcb3cdea448076387 # v3.2.2
    with:
      create-release: false
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      id-token: write
